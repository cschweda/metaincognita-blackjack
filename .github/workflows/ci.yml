name: CI

on:
  push:
    branches: [main, staging] # staging is where fixes batch up before one merge to main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests, build
    # pinned: ubuntu-latest became 26.04, where Playwright 1.60.0 (exact-pinned, see package.json)
    # refuses to install chromium — every e2e run failed from that day on
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json's packageManager
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - run: pnpm generate

  e2e:
    name: Playwright
    # pinned: ubuntu-latest became 26.04, where Playwright 1.60.0 (exact-pinned, see package.json)
    # refuses to install chromium — every e2e run failed from that day on
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          # the config uses the list reporter, so there is no playwright-report/ — traces and
          # error contexts land in test-results/
          path: test-results/
          retention-days: 7
